[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bfinance-datalake"
version = "0.2.0"
description = "Automated Historical Backfill & Daily EOD Scraper for Indian Equities, F&O, Indices, XBRL Fundamentals, Shareholding, Deals, and Mutual Funds"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "curl-cffi>=0.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=16.0.0",
    "lxml>=5.2.0",
    "duckdb",
]

[project.scripts]
datalake = "datalake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datalake"]
